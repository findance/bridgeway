[profile.default]
src            = "contracts"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "scripts"
solc           = "0.8.24"
optimizer      = true
optimizer_runs = 200
via_ir         = false

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
arbitrum      = "${ARBITRUM_RPC}"
arbitrum_fork = "${ARBITRUM_RPC}"

[etherscan]
arbitrum = { key = "${ARBISCAN_KEY}", chain = 42161, url = "https://api.arbiscan.io/api" }

[fuzz]
runs = 256

[invariant]
runs = 64
